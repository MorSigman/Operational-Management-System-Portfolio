<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopFloor Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0B1220;
    --bg-2:#0F1728;
    --surface:#141C2E;
    --surface-2:#1A2338;
    --surface-3:#212B42;
    --border:#232E44;
    --text:#E8ECF4;
    --text-muted:#8B96AC;
    --text-faint:#5E6A82;

    --accent:#3B82F6;
    --accent-strong:#60A5FA;
    --accent-soft:rgba(59,130,246,0.16);
    --accent-ink:#BFDBFE;

    --teal:#22D3C8;
    --teal-soft:rgba(34,211,200,0.14);
    --purple:#8B5CF6;
    --purple-soft:rgba(139,92,246,0.16);

    --good:#34D399;
    --good-soft:rgba(52,211,153,0.14);
    --warn:#F59E0B;
    --warn-soft:rgba(245,158,11,0.14);
    --crit:#F87171;
    --crit-soft:rgba(248,113,113,0.16);
    --info:#60A5FA;
    --info-soft:rgba(96,165,250,0.14);
    --neutral-chip:#232E44;
    --neutral-chip-ink:#9AA5B8;

    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 26px -14px rgba(0,0,0,0.6);
    --font-body:'Heebo','Segoe UI',sans-serif;
    --radius-s:7px; --radius-m:11px; --radius-l:14px;
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:13.5px; line-height:1.5; overflow-x:hidden; }
  h1,h2,h3{ font-family:var(--font-body); font-weight:800; text-wrap:balance; margin:0; }
  button{ font-family:inherit; }
  table{ border-collapse:collapse; width:100%; }
  .num{ font-variant-numeric:tabular-nums; }
  a{ color:var(--accent-strong); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  .app{ display:grid; grid-template-columns:208px 1fr; min-height:100vh; }
  @media (max-width: 900px){ .app{ grid-template-columns:1fr; } .rail{ display:none; } .topbar-tabs{ display:flex; } }

  .rail{ background:var(--bg-2); border-inline-end:1px solid var(--border); padding:16px 12px; display:flex; flex-direction:column; gap:16px; position:sticky; top:0; height:100vh; }
  .brand{ display:flex; align-items:center; gap:9px; padding:2px 4px 12px; border-bottom:1px solid var(--border); cursor:pointer; background:none; border-inline:none; border-top:none; width:100%; text-align:start; }
  .brand-mark{ width:32px;height:32px;border-radius:9px; background:linear-gradient(155deg, var(--accent), var(--purple)); display:flex;align-items:center;justify-content:center; color:#fff; font-weight:800; font-size:14px; flex:none; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.2; }
  .brand-text b{ font-weight:800; font-size:14.5px; }
  .brand-text span{ font-size:10px; color:var(--text-faint); }

  .nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-group-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-faint); font-weight:700; padding:10px 9px 4px; }
  .nav-btn{ display:flex; align-items:center; gap:9px; background:none; border:1px solid transparent; text-align:start; padding:8px 9px; border-radius:var(--radius-s); color:var(--text-muted); font-size:12.5px; font-weight:500; cursor:pointer; width:100%; position:relative; }
  .nav-btn .ico{ width:16px; text-align:center; flex:none; opacity:0.9; }
  .nav-btn:hover{ background:var(--surface-2); color:var(--text); }
  .nav-btn[aria-current="true"]{ background:var(--accent-soft); color:var(--accent-ink); font-weight:700; }
  .nav-badge{ margin-inline-start:auto; background:var(--crit); color:#fff; font-size:10px; font-weight:800; border-radius:999px; min-width:17px; height:17px; display:flex; align-items:center; justify-content:center; padding:0 4px; }

  .rail-foot{ margin-top:auto; padding-top:12px; border-top:1px solid var(--border); }
  .demo-pill{ display:flex; align-items:flex-start; gap:7px; background:var(--warn-soft); color:var(--warn); border-radius:var(--radius-s); padding:8px 9px; font-size:10.5px; line-height:1.4; }
  .demo-pill b{ display:block; font-size:10.5px; }

  .main{ min-width:0; }
  .topbar{ background:var(--bg-2); border-bottom:1px solid var(--border); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .topbar-left{ display:flex; align-items:center; gap:8px; }
  .icon-btn{ width:32px; height:32px; border-radius:8px; background:var(--surface); border:1px solid var(--border); color:var(--text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; }
  .icon-btn:hover{ color:var(--text); border-color:var(--accent); }
  .cloud-pill{ display:flex; align-items:center; gap:6px; background:var(--good-soft); color:var(--good); border-radius:999px; padding:6px 12px; font-size:11.5px; font-weight:700; }
  .cloud-pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .topbar-greet{ text-align:end; }
  .topbar-greet .g{ font-size:14px; font-weight:700; }
  .topbar-greet .d{ font-size:11px; color:var(--text-faint); }
  .topbar-tabs{ display:none; gap:6px; overflow-x:auto; }
  .topbar-tabs button{ flex:none; background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); padding:6px 10px; border-radius:999px; font-size:11.5px; cursor:pointer; }
  .lang-toggle{ display:flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; background:var(--surface); }
  .lang-toggle button{ border:none; background:none; padding:6px 11px; font-size:11.5px; font-weight:600; color:var(--text-muted); cursor:pointer; }
  .lang-toggle button[aria-pressed="true"]{ background:var(--accent); color:#fff; }

  .view{ display:none; padding:18px 20px 40px; max-width:1280px; margin:0 auto; }
  .view[data-active="true"]{ display:block; }

  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  .section-head h2{ font-size:17px; }
  .section-head .hint{ font-size:11.5px; color:var(--text-faint); }
  .back-link{ background:none; border:none; color:var(--accent-strong); font-size:12.5px; font-weight:600; cursor:pointer; padding:0 0 10px; display:inline-flex; align-items:center; gap:5px; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); box-shadow:var(--shadow); }

  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill.good{ background:var(--good-soft); color:var(--good); }
  .pill.warn{ background:var(--warn-soft); color:var(--warn); }
  .pill.crit{ background:var(--crit-soft); color:var(--crit); }
  .pill.info{ background:var(--info-soft); color:var(--info); }
  .pill.neutral{ background:var(--neutral-chip); color:var(--neutral-chip-ink); }
  .pill.accent{ background:var(--purple-soft); color:#D8CCFB; }

  .progress{ height:6px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
  .progress > span{ display:block; height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-strong)); border-radius:99px; }

  /* Home hero band */
  .home-band{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .mini-stat{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:12px 18px; flex:1; min-width:120px; text-align:center; box-shadow:var(--shadow); }
  .mini-stat b{ display:block; font-size:24px; font-weight:800; }
  .mini-stat span{ font-size:11px; color:var(--text-faint); }
  .mini-stat .sub{ font-size:10px; color:var(--good); }

  .prod-hero{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); box-shadow:var(--shadow); padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:14px; flex-wrap:wrap; }
  .prod-hero .big{ display:flex; align-items:center; gap:20px; }
  .prod-hero .big b{ font-size:34px; font-weight:800; display:block; line-height:1; }
  .prod-hero .big .lbl{ font-size:11.5px; color:var(--text-faint); margin-top:4px; }
  .donut{ width:76px; height:76px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; flex:none; }
  .donut span{ background:var(--surface); width:56px; height:56px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:800; font-size:15px; }
  .donut small{ font-size:8.5px; color:var(--text-faint); font-weight:600; }
  .chip-row{ display:flex; gap:14px; margin-top:10px; flex-wrap:wrap; font-size:11.5px; color:var(--text-muted); }
  .chip-row .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-inline-end:5px; }

  .dash-grid{ display:grid; grid-template-columns:0.85fr 1.4fr; gap:14px; align-items:start; }
  @media (max-width:900px){ .dash-grid{ grid-template-columns:1fr; } }

  /* mini calendar */
  .cal-card{ padding:14px; }
  .cal-title{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:13px; font-weight:700; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center; }
  .cal-grid .dow{ font-size:9.5px; color:var(--text-faint); padding-bottom:4px; }
  .cal-grid .day{ font-size:11px; padding:6px 2px; border-radius:6px; color:var(--text-muted); position:relative; }
  .cal-grid .day.today{ background:var(--accent); color:#fff; font-weight:800; }
  .cal-grid .day.has-evt::after{ content:""; position:absolute; bottom:2px; inset-inline-start:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--teal); }
  .cal-list{ margin-top:12px; }
  .cal-list .h{ font-size:11px; font-weight:700; color:var(--text-faint); margin:10px 0 5px; }
  .cal-item{ display:flex; align-items:center; gap:7px; padding:5px 0; font-size:11.5px; }
  .cal-item input{ accent-color: var(--accent); }

  .proj-list{ display:flex; flex-direction:column; }
  .proj-row{ display:grid; grid-template-columns:auto 1fr 90px 60px; gap:12px; align-items:center; padding:11px 15px; border-top:1px solid var(--border); cursor:pointer; }
  .proj-row:first-child{ border-top:none; }
  .proj-row:hover{ background:var(--surface-2); }
  .proj-name{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .proj-name b{ font-size:12.5px; }
  .proj-name span{ font-size:10.5px; color:var(--text-faint); }
  .proj-row .pct{ font-size:11px; text-align:end; color:var(--text-muted); }

  .table-wrap{ overflow-x:auto; }
  .attn-list{ display:flex; flex-direction:column; gap:9px; padding:14px; }
  .attn-item{ display:flex; align-items:center; gap:9px; font-size:11.5px; }
  .attn-item .ico{ width:26px; height:26px; border-radius:7px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex:none; font-size:12px; }
  .attn-item b{ display:block; font-size:11.5px; }
  .attn-item span{ color:var(--text-faint); font-size:10.5px; }
  .attn-item .days{ margin-inline-start:auto; }

  /* Generic data table */
  table.dt th{ text-align:start; font-size:10px; text-transform:uppercase; letter-spacing:0.4px; color:var(--text-faint); padding:9px 14px; border-bottom:1px solid var(--border); background:var(--surface-2); }
  table.dt td{ padding:10px 14px; border-bottom:1px solid var(--border); font-size:12px; }
  table.dt tr:last-child td{ border-bottom:none; }
  table.dt td.num, table.dt th.num{ text-align:end; }

  .banner{ display:flex; align-items:center; gap:8px; background:var(--crit-soft); color:var(--crit); border-radius:var(--radius-s); padding:9px 14px; font-size:12px; font-weight:700; margin-bottom:14px; width:fit-content; }

  .toolbar{ display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .btn{ border:none; border-radius:var(--radius-s); padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; }
  .btn.primary{ background:var(--accent); color:#fff; }
  .btn.purple{ background:var(--purple); color:#fff; }
  .btn.good{ background:var(--good); color:#04231a; }
  .btn.ghost{ background:var(--surface); border:1px solid var(--border); color:var(--text-muted); }
  .search-box{ flex:1; min-width:180px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-s); padding:8px 12px; color:var(--text-muted); font-size:12px; }
  .select-box{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-s); padding:8px 12px; color:var(--text-muted); font-size:12px; }

  /* Production stat tiles (colored) */
  .stat-tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
  @media (max-width:800px){ .stat-tiles{ grid-template-columns:repeat(2,1fr);} }
  .stat-tile{ border-radius:var(--radius-l); padding:16px; color:#fff; display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow); }
  .stat-tile .v{ font-size:24px; font-weight:800; }
  .stat-tile .l{ font-size:11px; opacity:0.9; }
  .stat-tile.t-purple{ background:linear-gradient(140deg,#7C3AED,#5B21B6); }
  .stat-tile.t-good{ background:linear-gradient(140deg,#10B981,#047857); }
  .stat-tile.t-warn{ background:linear-gradient(140deg,#F59E0B,#B45309); }
  .stat-tile.t-info{ background:linear-gradient(140deg,#3B82F6,#1D4ED8); }

  /* Production project cards */
  .pcard-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:12px; }
  .pcard{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); padding:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px; }
  .pcard-head{ display:flex; justify-content:space-between; align-items:flex-start; }
  .pcard-head b{ font-size:13px; }
  .pcard .meta-row{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-faint); }
  .pcard .meta-row b{ display:block; color:var(--text-muted); font-size:11.5px; font-weight:700; }
  .pcard .price{ font-size:14px; font-weight:800; color:var(--accent-strong); }
  .pcard .price small{ font-size:9.5px; color:var(--text-faint); font-weight:500; }
  .pcard-mini th, .pcard-mini td{ padding:4px 0; font-size:10px; border:none; }
  .pcard-mini th{ color:var(--text-faint); text-transform:none; letter-spacing:0; background:none; }

  /* HR calendar */
  .hr-cal{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .hr-cal .day-cell{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-s); min-height:70px; padding:6px; }
  .hr-cal .dnum{ font-size:10.5px; color:var(--text-faint); margin-bottom:4px; }
  .hr-cal .dnum.today{ color:var(--accent-strong); font-weight:800; }
  .leave-bar{ background:var(--info-soft); color:var(--info); border-radius:4px; padding:2px 5px; font-size:9.5px; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .leave-bar.bday{ background:var(--crit-soft); color:var(--crit); }

  /* Invoices cards */
  .inv-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); padding:16px; box-shadow:var(--shadow); margin-bottom:12px; }
  .inv-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
  .inv-top .amt{ font-size:20px; font-weight:800; }
  .inv-top .nm{ text-align:end; }
  .inv-top .nm b{ font-size:13px; display:block; }
  .inv-top .nm span{ font-size:10.5px; color:var(--text-faint); }
  .inv-sub{ font-size:10.5px; color:var(--text-faint); margin-bottom:8px; }
  .inv-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; flex-wrap:wrap; gap:8px; }
  .inv-stats{ display:flex; gap:14px; font-size:11px; color:var(--text-muted); }

  /* Logistics vehicle cards */
  .veh-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:12px; }
  .veh-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); padding:14px; box-shadow:var(--shadow); }
  .veh-card .plate{ font-size:15px; font-weight:800; margin-bottom:2px; }
  .veh-card .model{ font-size:11.5px; color:var(--text-muted); margin-bottom:2px; }
  .veh-card .driver{ font-size:10.5px; color:var(--text-faint); margin-bottom:8px; }
  .veh-card .pills{ display:flex; gap:6px; flex-wrap:wrap; }

  /* Kanban (tasks/floor/doors) */
  .kanban{ display:grid; grid-auto-flow:column; grid-auto-columns:minmax(220px,1fr); gap:12px; overflow-x:auto; padding-bottom:10px; }
  .kb-col{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-m); display:flex; flex-direction:column; min-height:110px; }
  .kb-col-head{ padding:10px 12px 8px; border-bottom:1px dashed var(--border); display:flex; align-items:center; gap:7px; }
  .kb-col-head .dot{ width:8px; height:8px; border-radius:50%; }
  .kb-col-head b{ font-size:11.5px; }
  .kb-col-head .count{ font-size:11px; color:var(--text-faint); margin-inline-start:auto; }
  .kb-col-body{ padding:9px; display:flex; flex-direction:column; gap:8px; }
  .kb-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-s); padding:9px 10px; box-shadow:var(--shadow); }
  .kb-card[data-hidden="true"]{ display:none; }
  .kb-card b{ display:block; font-size:11.5px; margin-bottom:3px; }
  .kb-card.done b{ text-decoration:line-through; color:var(--text-faint); }
  .kb-card .meta{ font-size:10px; color:var(--text-faint); margin-bottom:6px; }
  .kb-card .foot{ display:flex; justify-content:space-between; align-items:center; }

  /* Drafting */
  .draft-grid{ display:grid; grid-template-columns:1.1fr 1fr; gap:16px; align-items:start; }
  @media (max-width:900px){ .draft-grid{ grid-template-columns:1fr; } }
  .preset-row{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .preset-btn{ background:var(--surface); border:1px solid var(--border); color:var(--text-muted); padding:8px 13px; border-radius:var(--radius-s); font-size:12px; font-weight:600; cursor:pointer; }
  .preset-btn[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .canvas-card{ padding:15px; }
  .canvas-frame{ background: linear-gradient(rgba(96,165,250,0.08) 1px, transparent 1px) 0 0/24px 24px, linear-gradient(90deg, rgba(96,165,250,0.08) 1px, transparent 1px) 0 0/24px 24px, var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-m); padding:10px; }
  .canvas-frame svg{ width:100%; height:auto; display:block; }
  .wall-label{ font-size:11px; fill:var(--text-muted); }
  .room-fill{ fill:var(--accent-soft); }
  .wall-line{ stroke:var(--accent-strong); stroke-width:3; }
  .corner-dot{ fill:var(--accent-strong); }
  .door-arc{ stroke:var(--warn); stroke-width:1.6; fill:none; stroke-dasharray:3 3; }
  .door-leaf{ stroke:var(--warn); stroke-width:2.4; }
  .bom-card{ padding:0; overflow:hidden; }
  .bom-head{ padding:13px 15px 9px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:baseline; }
  .bom-head h3{ font-size:14.5px; }
  .bom-total{ font-size:15px; font-weight:800; color:var(--accent-strong); }

  /* Scheduling */
  .gantt{ padding:15px; margin-bottom:16px; }
  .gantt-row{ display:grid; grid-template-columns:110px 1fr; align-items:center; gap:10px; padding:6px 0; }
  .gantt-row .label{ font-size:11.5px; color:var(--text-muted); }
  .gantt-track{ position:relative; height:20px; background:var(--surface-2); border-radius:5px; }
  .gantt-bar{ position:absolute; top:2px; bottom:2px; border-radius:4px; background:linear-gradient(90deg, var(--accent-strong), var(--accent)); }
  .gantt-bar.warn{ background:linear-gradient(90deg, var(--warn), #d99b3c); }
  .week-grid{ display:grid; grid-template-columns:100px repeat(5,1fr); border:1px solid var(--border); border-radius:var(--radius-m); overflow:hidden; }
  .week-grid > div{ padding:9px; border-bottom:1px solid var(--border); border-inline-start:1px solid var(--border); font-size:11.5px; }
  .week-grid > div:nth-child(6n+1){ border-inline-start:none; background:var(--surface-2); font-weight:700; }
  .week-grid > .wh{ background:var(--surface-2); font-weight:700; font-size:10px; text-transform:uppercase; letter-spacing:0.4px; color:var(--text-faint); }

    if(id === "production"){ current = {module:"production", tab:"dashboard"}; }

  }
  function openProdTab(id){ current = {module:"production", tab:id}; renderAll(); }

  function renderNav(){
    var nav = document.getElementById("nav");
    nav.innerHTML = "";
    if(current.module === "production"){
      var back = document.createElement("button");
      back.className = "nav-btn"; back.innerHTML = '<span class="ico">←</span><span>'+t("back")+'</span>';
      back.addEventListener("click", goHome);
      nav.appendChild(back);
      var label = document.createElement("div");
      label.className = "nav-group-label"; label.textContent = t("navgroup.production");
      nav.appendChild(label);
      PRODUCTION_TABS.forEach(function(tab){
        var b = document.createElement("button");
        b.className = "nav-btn";
        b.setAttribute("aria-current", String(current.tab===tab.id));
        b.innerHTML = '<span class="ico">'+tab.ico+'</span><span>'+t(tab.key)+'</span>';
        b.addEventListener("click", function(){ openProdTab(tab.id); });
        nav.appendChild(b);
      });
    } else if(current.module !== "home"){
      var back2 = document.createElement("button");
      back2.className = "nav-btn"; back2.innerHTML = '<span class="ico">←</span><span>'+t("back")+'</span>';
      back2.addEventListener("click", goHome);
      nav.appendChild(back2);

        var b = document.createElement("button");
        b.className = "nav-btn";
        b.setAttribute("aria-current", String(current.module===m.id));
        b.innerHTML = '<span class="ico">'+m.ico+'</span><span>'+t(m.key)+'</span>'+(m.badge?'<span class="nav-badge">'+m.badge+'</span>':'');
        b.addEventListener("click", function(){ openModule(m.id); });
        nav.appendChild(b);
      });
    } else {
      HOME.forEach(function(m){
        var b = document.createElement("button");
        b.className = "nav-btn";
        b.setAttribute("aria-current","false");
        b.innerHTML = '<span class="ico">'+m.ico+'</span><span>'+t(m.key)+'</span>'+(m.badge?'<span class="nav-badge">'+m.badge+'</span>':'');

        nav.appendChild(b);
      });
    }

    document.getElementById("pageTitle").textContent = t(titleKey);

    tabs.innerHTML = "";
    var items = current.module==="production" ? PRODUCTION_TABS : HOME;

      {code:"PRJ-2401", name:"North Site", total:63400, remaining:63400, paid:0, billed:0, note:true},
      {code:"PRJ-2402", name:"East Warehouse Unit", total:38200, remaining:38200, paid:0, billed:0, note:true},
      {code:"PRJ-2403", name:"Central Hall", total:81500, remaining:0, paid:81500, billed:0, note:false},
      {code:"PRJ-2405", name:"Hilltop Complex", total:52950, remaining:52950, paid:0, billed:0, note:true}
    ];
    var total = rows.reduce(function(s,r){return s+r.total;},0);
    var html = '<div class="home-band">' +
      miniStat(t("inv.overdue"),"0") + miniStat(t("inv.matured"),"1") + miniStat(t("inv.pending"),"₪0") + miniStat(t("inv.paid"),"₪81,500") + miniStat(t("inv.billed"),"₪0") + miniStat(t("inv.totalvalue"),"₪"+total.toLocaleString()) +
      '</div>' +
      '<input class="search-box" style="width:100%; margin-bottom:14px;" placeholder="'+t("inv.search")+'">';
    rows.forEach(function(r){
      html += '<div class="inv-card"><div class="inv-top"><span class="amt num">₪'+r.total.toLocaleString()+'</span><div class="nm"><b>'+r.name+'</b><span>'+r.code+'</span></div></div>' +
        '<div class="progress" style="margin-bottom:8px;"><span style="width:'+Math.round(r.paid/r.total*100)+'%"></span></div>' +
        '<div class="inv-stats"><span>'+t("inv.remaining")+': ₪'+r.remaining.toLocaleString()+'</span><span style="color:var(--good)">'+t("inv.paid")+': ₪'+r.paid.toLocaleString()+'</span><span style="color:var(--accent-strong)">'+t("inv.billed")+': ₪'+r.billed.toLocaleString()+'</span></div>' +
        (r.note?'<div style="font-size:10.5px; color:var(--text-faint); font-style:italic; margin-top:6px;">'+t("inv.noplan")+'</div>':'') +
        '<div class="inv-foot"><span style="font-size:11px; color:var(--text-faint);">0 '+t("inv.milestones")+'</span><span><button class="btn purple" style="margin-inline-end:6px;">+ '+t("inv.newmilestone")+'</button><button class="btn ghost">'+t("inv.plan")+'</button></span></div>' +
      '</div>';
    });
    host.innerHTML = html;
  }

  function renderLogistics(){
    var vehicles = [
      {plate:"42-771-90", model: lang==="he"?"מסחרי · 2022":"Van · 2022", driver:"רונית שדה", ins:151, test:160},
      {plate:"18-330-24", model: lang==="he"?"משאית · 2020":"Truck · 2020", driver:"עומר בכר", ins:37, test:78},
      {plate:"77-905-13", model: lang==="he"?"מסחרי · 2023":"Van · 2023", driver:"טל אריאלי", ins:229, test:341},
      {plate:"63-410-88", model: lang==="he"?"נגרר · 2021":"Trailer · 2021", driver:"נועה גל", ins:188, test:257}
    ];
    var expiring = vehicles.filter(function(v){ return v.ins<60 || v.test<60; }).length;
    var html = '<div class="banner">⚠ '+expiring+' '+t("lg.expiring")+'</div>' +
      '<div class="toolbar"><button class="btn purple">+ '+t("lg.newvehicle")+'</button><input class="search-box" placeholder="'+t("lg.search")+'"></div>' +
      '<div class="veh-grid">';
    vehicles.forEach(function(v){
      var insCls = v.ins<60?"crit":"good", testCls = v.test<60?"crit":"good";
      html += '<div class="veh-card"><div class="plate">'+v.plate+'</div><div class="model">'+v.model+'</div><div class="driver">👤 '+v.driver+'</div>' +
        '<div class="pills"><span class="pill '+insCls+'">'+t("lg.insurance")+': '+v.ins+' '+t("lg.days")+'</span><span class="pill '+testCls+'">'+t("lg.test")+': '+v.test+' '+t("lg.days")+'</span></div></div>';
    });
    html += '</div>';
    host.innerHTML = html;
  }

  function renderTasks(){
    var cols = [
      {key:"col.done", color:"var(--good)", items:[
        ["Weekly safety walk-through","אבי פרץ",true],["Restock corner post bin","דנה כהן",true],["Replace cutting blade — Station 2","יוסי לוי",true],["Confirm delivery window — PRJ-2403","מיכל אברהם",true],["Order insulation stock","אלון רז",true]
      ]},
      {key:"col.progress", color:"var(--warn)", items:[
        ["Calibrate bending press","נועה שני",false]
      ]},
      {key:"col.opened", color:"var(--text-faint)", items:[]}
    ];
    var html = '<div class="home-band">' +
      miniStat(t("tasks.today"),"3") + miniStat(t("tasks.remindtoday"),"0") + miniStat(t("tasks.donemonth"),"5") + miniStat(t("tasks.overdue"),"0") + miniStat(t("tasks.open"),"1") +
      '</div>' +
      '<div class="toolbar"><button class="btn primary">+ '+t("tasks.new")+'</button><select class="select-box">'+t("tasks.allpriority")+'</select><select class="select-box">'+t("tasks.allemployees")+'</select></div>' +
      '<div class="kanban">';
    cols.forEach(function(c){
      html += '<div class="kb-col"><div class="kb-col-head"><span class="dot" style="background:'+c.color+'"></span><b>'+t(c.key)+'</b><span class="count num">'+c.items.length+'</span></div><div class="kb-col-body">';
      c.items.forEach(function(item){
        html += '<div class="kb-card'+(item[2]?" done":"")+'"><b>'+item[0]+'</b><div class="foot"><span class="meta">'+item[1]+'</span></div></div>';
      });
      html += '</div></div>';
    });
    html += '</div>';
    host.innerHTML = html;
  }

  function renderView(){
    if(current.module==="home") return renderHome();
    if(current.module==="production"){
      if(current.tab==="dashboard") return renderDashboard();
      if(current.tab==="project") return renderProject();
      if(current.tab==="drafting") return renderDrafting();
      if(current.tab==="floor") return renderFloor();
      if(current.tab==="doors") return renderDoors();
      if(current.tab==="schedule") return renderSchedule();
    }
    if(current.module==="warehouse") return renderWarehouse();
    if(current.module==="hr") return renderHR();
    if(current.module==="invoices") return renderInvoices();
    if(current.module==="logistics") return renderLogistics();
    if(current.module==="tasks") return renderTasks();
  }

  function renderAll(){
    applyI18n();
    renderNav();
    renderTopbar();
    renderView();
  }

  setLang("he");
})();
</script>
</body>
</html>
