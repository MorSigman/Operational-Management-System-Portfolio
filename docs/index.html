<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopFloor Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    /* page-level tokens, matching the real system's dark theme exactly */
    --page:#080d1a;
    --sunken:#121a2e;
    --surface:#1c2743;
    --surface-2:#26324f;
    --surface-3:#303d5e;
    --border:#2a3757;
    --border-strong:#41527a;

    --ink:#f1f5f9;
    --ink-2:#cbd5e1;
    --ink-3:#94a3b8;

    --crit:#fca5a5; --crit-soft:rgba(153,27,27,0.22); --crit-line:rgba(185,28,28,0.45);
    --warn:#fcd34d; --warn-soft:rgba(146,64,14,0.22); --warn-line:rgba(180,83,9,0.45);
    --ok:#6ee7b7;
    --accent:#93c5fd; --accent-soft:rgba(37,99,235,0.16);
    --today-bg:#2563eb;

    --ring-a:#60a5fa; --ring-b:#34d399;
    --stage-prod:#60a5fa; --stage-ready:#34d399; --stage-idle:#64748b; --stage-done:#22d3ee;

    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 28px -16px rgba(0,0,0,0.65);

    /* sidebar tokens */
    --sh-bg:#090d15;
    --sh-line:#222c44;
    --sh-ink:#f2f6fb;
    --sh-ink-2:#a7b3c6;
    --sh-ink-3:#78849a;
    --sh-hover:rgba(255,255,255,0.045);
    --sh-w:220px;

    --font-body:'Heebo','Segoe UI',sans-serif;
    --radius-s:8px; --radius-m:12px; --radius-l:14px;
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--page); color:var(--ink); font-family:var(--font-body); font-size:13.5px; line-height:1.5; overflow-x:hidden; }
  h1,h2,h3{ font-family:var(--font-body); font-weight:800; text-wrap:balance; margin:0; }
  button{ font-family:inherit; }
  table{ border-collapse:collapse; width:100%; }
  .num{ font-variant-numeric:tabular-nums; }
  a{ color:var(--accent); }
  :focus-visible{ outline:2px solid #2563eb; outline-offset:2px; border-radius:8px; }

  /* ============ Fixed sidebar (matches real app-shell exactly) ============ */
  .sh-side{
    position:fixed; inset-block:0; inset-inline-start:0; width:var(--sh-w); z-index:35;
    display:flex; flex-direction:column; background:var(--sh-bg); border-inline-end:1px solid var(--sh-line);
  }
  .sh-main{ margin-inline-start:var(--sh-w); min-width:0; }
  @media (max-width: 900px){
    .sh-side{ display:none; }
    .sh-main{ margin-inline-start:0; }
    .topbar-tabs{ display:flex; }
  }

  .sh-top{ height:68px; flex:none; display:flex; align-items:center; gap:11px; padding:0 15px; border-bottom:1px solid var(--sh-line); cursor:pointer; background:none; border-inline:none; border-top:none; width:100%; text-align:start; }
  .sh-logo{ width:34px; height:34px; border-radius:9px; background:linear-gradient(140deg,#4a7cc7,#22304d); flex:none; display:flex; align-items:center; justify-content:center; color:#e6efff; font-weight:800; font-size:13px; }
  .sh-name{ min-width:0; overflow:hidden; white-space:nowrap; }
  .sh-name b{ display:block; font-size:14px; font-weight:700; color:var(--sh-ink); line-height:1.25; }
  .sh-name span{ display:block; font-size:10.5px; color:var(--sh-ink-3); line-height:1.25; margin-top:1px; }

  .sh-nav{ flex:1; min-height:0; overflow-y:auto; padding:14px 11px; display:flex; flex-direction:column; gap:4px; }
  .sh-lbl{ font-size:10.5px; font-weight:800; color:var(--sh-ink-3); letter-spacing:0.09em; padding:6px 11px 8px; }
  .sh-item{
    position:relative; display:flex; align-items:center; gap:12px; width:100%; height:44px; padding:0 12px;
    border-radius:12px; color:var(--sh-ink-2); background:transparent; border:0; cursor:pointer; text-align:start;
    font:inherit; font-size:14px; font-weight:600;
  }
  .sh-item .sh-ic{ width:19px; text-align:center; flex:none; color:var(--sh-ink-2); }
  .sh-item .sh-tx{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sh-item:hover{ background:var(--sh-hover); color:var(--sh-ink); }
  .sh-item:hover .sh-ic{ color:var(--nav-c); }
  .sh-item.is-on{ color:var(--sh-ink); background:linear-gradient(90deg, var(--nav-soft), transparent 72%); font-weight:700; }
  .sh-item.is-on .sh-ic{ color:var(--nav-c); }
  .sh-item.is-on::before{
    content:''; position:absolute; inset-inline-end:-11px; top:8px; bottom:8px; width:3.5px; border-radius:99px;
    background:var(--nav-c); box-shadow:0 0 14px 0 var(--nav-glow);
  }
  .sh-badge{
    flex:none; margin-inline-start:auto; font-size:11px; font-weight:800; font-variant-numeric:tabular-nums;
    border-radius:99px; padding:2px 7px; color:var(--crit); background:var(--crit-soft); box-shadow:inset 0 0 0 1px var(--crit-line);
  }
  .sh-bot{ flex:none; padding:11px; border-top:1px solid var(--sh-line); display:flex; flex-direction:column; gap:4px; }
  .sh-user{ display:flex; align-items:center; gap:10px; height:44px; padding:0 10px; border-radius:11px; background:transparent; border:0; cursor:pointer; width:100%; text-align:start; }
  .sh-user:hover{ background:var(--sh-hover); }
  .sh-av{ width:26px; height:26px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:11px; font-weight:700; color:#e6efff; background:linear-gradient(140deg,#4a7cc7,#22304d); }
  .sh-un{ flex:1; min-width:0; overflow:hidden; white-space:nowrap; font-size:12.5px; font-weight:600; color:var(--sh-ink-2); }
  .sh-out{ width:15px; text-align:center; flex:none; color:var(--sh-ink-3); }
  .demo-note{ margin:8px 3px 2px; background:var(--warn-soft); color:var(--warn); border-radius:var(--radius-s); padding:8px 9px; font-size:10.5px; line-height:1.4; }
  .demo-note b{ display:block; font-size:10.5px; }

  /* ============ Topbar (matches real TopBar.tsx) ============ */
  .topbar{ position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--border); }
  .topbar-inner{ max-width:1800px; margin:0 auto; padding:0 20px; height:68px; display:flex; align-items:center; gap:16px; }
  .greet b{ display:block; font-size:18px; font-weight:800; letter-spacing:-0.02em; }
  .greet span{ display:block; font-size:12px; color:var(--ink-3); margin-top:2px; }
  .topbar-actions{ display:flex; align-items:center; gap:8px; margin-inline-start:auto; }
  .cloud-pill{ display:flex; align-items:center; gap:6px; background:rgba(52,211,153,0.14); color:#6ee7b7; border-radius:999px; padding:6px 12px; font-size:11.5px; font-weight:700; }
  .cloud-pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .vsep{ width:1px; height:26px; background:var(--border); }
  .icon-btn{ width:36px; height:36px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); color:var(--ink-2); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; }
  .icon-btn:hover{ color:var(--ink); background:var(--surface-3); }
  .lang-toggle{ display:flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; background:var(--surface-2); }
  .lang-toggle button{ border:none; background:none; padding:6px 11px; font-size:11.5px; font-weight:600; color:var(--ink-3); cursor:pointer; }
  .lang-toggle button[aria-pressed="true"]{ background:#2563eb; color:#fff; }
  .topbar-tabs{ display:none; gap:6px; overflow-x:auto; padding:8px 20px; border-bottom:1px solid var(--border); background:var(--surface); }
  .topbar-tabs button{ flex:none; background:var(--surface-2); border:1px solid var(--border); color:var(--ink-3); padding:6px 10px; border-radius:999px; font-size:11.5px; cursor:pointer; }
  .topbar-tabs button[aria-current="true"]{ background:#2563eb; color:#fff; }

  .view{ max-width:1800px; margin:0 auto; padding:22px 20px 40px; }

  /* ============ Shared primitives ============ */
  .h-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); }
  .h-sunken{ background:var(--sunken); border:1px solid var(--border); border-radius:16px; }

  .section-head{ display:flex; align-items:center; gap:12px; margin-bottom:14px; padding:0 2px; }
  .section-head h2{ font-size:15.5px; letter-spacing:-0.015em; }
  .section-head .rule{ flex:1; height:1px; background:var(--border); }
  .section-head .badge{ font-size:11.5px; font-weight:700; border-radius:999px; padding:3px 10px; color:var(--crit); background:var(--crit-soft); }
  .section-head .action{ display:flex; align-items:center; gap:3px; font-size:12.5px; font-weight:600; color:var(--ink-3); background:none; border:none; cursor:pointer; }
  .section-head .action:hover{ color:var(--accent); }

  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill.good{ background:rgba(52,211,153,0.16); color:var(--ok); }
  .pill.warn{ background:var(--warn-soft); color:var(--warn); }
  .pill.crit{ background:var(--crit-soft); color:var(--crit); }
  .pill.info{ background:rgba(96,165,250,0.16); color:#60a5fa; }
  .pill.neutral{ background:var(--surface-3); color:var(--ink-3); }
  .pill.accent{ background:rgba(167,139,250,0.16); color:#c4b5fd; }

  .progress{ height:6px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
  .progress > span{ display:block; height:100%; background:linear-gradient(90deg, var(--ring-a), var(--ring-b)); border-radius:99px; }

  /* ============ Home: Production Summary hero ============ */
  .prod-summary{ overflow:hidden; margin-bottom:24px; }
  .ps-top{ display:flex; flex-wrap:wrap; align-items:center; gap:20px; padding:16px 22px; }
  .ring-wrap{ position:relative; width:106px; height:106px; flex:none; }
  .ring-wrap svg{ width:100%; height:100%; }
  .ring-mid{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .ring-mid b{ font-size:26px; font-weight:800; line-height:1; }
  .ring-mid span{ font-size:10.5px; font-weight:700; color:var(--ink-3); margin-top:2px; }
  .ps-head{ flex:none; min-width:170px; border-inline-start:1px solid var(--border); padding-inline-start:22px; }
  .ps-head .lbl{ font-size:12px; font-weight:700; letter-spacing:0.055em; color:var(--ink-3); }
  .ps-head .row{ display:flex; align-items:baseline; gap:9px; margin-top:6px; }
  .ps-head b{ font-size:46px; font-weight:800; line-height:0.92; }
  .ps-head .unit{ font-size:14.5px; font-weight:600; color:var(--ink-2); }
  .ps-head .sub{ font-size:12.5px; color:var(--ink-3); margin-top:6px; }
  .ps-kpis{ display:flex; flex:1; justify-content:flex-end; flex-wrap:wrap; }
  .ps-kpi{ padding:0 22px; text-align:start; border-inline-end:1px solid var(--border); }
  .ps-kpi:last-child{ border-inline-end:none; padding-inline-end:0; }
  .ps-kpi .lbl{ font-size:12.5px; font-weight:600; color:var(--ink-2); }
  .ps-kpi b{ display:block; font-size:28px; font-weight:700; line-height:1.05; margin-top:6px; }
  .ps-kpi .sub{ display:block; font-size:11.5px; color:var(--ink-3); margin-top:4px; }
  .ps-strip{ display:flex; flex-wrap:wrap; align-items:center; gap-y:4px; padding:10px 22px; border-top:1px solid var(--border); background:var(--surface-2); }
  .ps-strip .seg{ display:flex; align-items:baseline; gap:8px; padding:0 16px; border-inline-end:1px solid var(--border); }
  .ps-strip .seg:first-child{ padding-inline-start:0; }
  .ps-strip .dot{ width:8px; height:8px; border-radius:50%; }
  .ps-strip b{ font-size:18px; font-weight:700; }
  .ps-strip .l{ font-size:12.5px; color:var(--ink-2); }
  .ps-strip .tail{ margin-inline-start:auto; font-size:11.5px; color:var(--ink-3); }

  .dash-grid{ display:grid; grid-template-columns:1fr 360px; gap:26px; align-items:start; }
  @media (max-width:1100px){ .dash-grid{ grid-template-columns:1fr; } }

  /* Active projects row list */
  .proj-list{ overflow:hidden; }
  .proj-row{ display:flex; align-items:center; gap:14px; width:100%; padding:0 15px; height:60px; background:none; border:0; border-top:1px solid var(--border); cursor:pointer; text-align:start; color:inherit; }
  .proj-row:first-child{ border-top:none; }
  .proj-row:hover{ background:var(--surface-2); }
  .proj-row .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .proj-row .nm{ flex:1; min-width:0; }
  .proj-row .nm b{ display:block; font-size:14.5px; font-weight:700; }
  .proj-row .nm span{ display:block; font-size:11.5px; color:var(--ink-3); margin-top:2px; }
  .proj-row .rooms{ font-size:12px; font-weight:600; color:var(--ink-2); white-space:nowrap; flex:none; }
  .proj-row .bar{ width:90px; flex:none; }
  .proj-row .pct{ font-size:13px; font-weight:700; width:38px; text-align:end; flex:none; }
  .proj-more{ display:flex; align-items:center; justify-content:center; gap:5px; width:100%; padding:11px; font-size:12px; font-weight:600; color:var(--ink-3); background:none; border:none; border-top:1px solid var(--border); cursor:pointer; }
  .proj-more:hover{ color:var(--accent); background:var(--surface-2); }

  .attn-list{ overflow:hidden; }
  .attn-row{ display:flex; align-items:center; gap:11px; padding:11px 15px; border-top:1px solid var(--border); font-size:12.5px; }
  .attn-row:first-child{ border-top:none; }
  .attn-row .ico{ width:30px; height:30px; border-radius:9px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex:none; font-size:13px; }
  .attn-row b{ display:block; font-size:12.5px; }
  .attn-row .sub{ display:block; font-size:11px; color:var(--ink-3); margin-top:1px; }
  .attn-row .days{ margin-inline-start:auto; flex:none; }

  /* mini calendar */
  .cal-title{ display:flex; justify-content:space-between; align-items:center; padding:14px 16px 10px; font-size:13px; font-weight:700; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center; padding:0 14px 10px; }
  .cal-grid .dow{ font-size:9.5px; color:var(--ink-3); padding-bottom:4px; }
  .cal-grid .day{ font-size:11px; padding:6px 2px; border-radius:6px; color:var(--ink-2); position:relative; }
  .cal-grid .day.today{ background:var(--today-bg); color:#fff; font-weight:800; }
  .cal-grid .day.has-evt::after{ content:""; position:absolute; bottom:2px; inset-inline-start:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:#22d3ee; }
  .cal-list{ border-top:1px solid var(--border); padding:10px 16px 14px; }
  .cal-list .h{ font-size:11px; font-weight:700; color:var(--ink-3); margin:8px 0 5px; }
  .cal-item{ display:flex; align-items:center; gap:7px; padding:5px 0; font-size:11.5px; }
  .cal-item input{ accent-color:#2563eb; }

  /* ============ Generic module bits reused across screens ============ */
  .toolbar{ display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .btn{ border:none; border-radius:10px; padding:8px 14px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .btn.primary{ background:#2563eb; color:#fff; }
  .btn.purple{ background:#7c3aed; color:#fff; }
  .btn.good{ background:#059669; color:#fff; }
  .btn.ghost{ background:var(--surface-2); border:1px solid var(--border); color:var(--ink-2); }
  .search-box{ flex:1; min-width:180px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; color:var(--ink-2); font-size:12px; }
  .select-box{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; color:var(--ink-2); font-size:12px; }

  .banner{ display:flex; align-items:center; gap:8px; background:var(--crit-soft); color:var(--crit); border-radius:10px; padding:9px 14px; font-size:12px; font-weight:700; margin-bottom:14px; width:fit-content; }

  table.dt th{ text-align:start; font-size:10px; text-transform:uppercase; letter-spacing:0.4px; color:var(--ink-3); padding:9px 14px; border-bottom:1px solid var(--border); background:var(--surface-2); }
  table.dt td{ padding:10px 14px; border-bottom:1px solid var(--border); font-size:12px; }
  table.dt tr:last-child td{ border-bottom:none; }
  table.dt td.num, table.dt th.num{ text-align:end; }
  .table-wrap{ overflow-x:auto; }

  .stat-tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  @media (max-width:800px){ .stat-tiles{ grid-template-columns:repeat(2,1fr);} }
  .stat-tile{ border-radius:14px; padding:16px; color:#fff; display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow); }
  .stat-tile .v{ font-size:24px; font-weight:800; }
  .stat-tile .l{ font-size:11px; opacity:0.9; }
  .stat-tile.t-purple{ background:linear-gradient(140deg,#7C3AED,#5B21B6); }
  .stat-tile.t-good{ background:linear-gradient(140deg,#059669,#047857); }
  .stat-tile.t-warn{ background:linear-gradient(140deg,#d97706,#92400e); }
  .stat-tile.t-info{ background:linear-gradient(140deg,#2563eb,#1D4ED8); }

  .pcard-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:12px; }
  .pcard{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px; }
  .pcard-head{ display:flex; justify-content:space-between; align-items:flex-start; }
  .pcard-head b{ font-size:13px; }
  .pcard .meta-row{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-3); }
  .pcard .meta-row b{ display:block; color:var(--ink-2); font-size:11.5px; font-weight:700; }
  .pcard .price{ font-size:14px; font-weight:800; color:#60a5fa; }
  .pcard .price small{ font-size:9.5px; color:var(--ink-3); font-weight:500; }
  .pcard-mini th, .pcard-mini td{ padding:4px 0; font-size:10px; border:none; }
  .pcard-mini th{ color:var(--ink-3); text-transform:none; letter-spacing:0; background:none; }

  .hr-cal{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .hr-cal .day-cell{ background:var(--surface); border:1px solid var(--border); border-radius:10px; min-height:70px; padding:6px; }
  .hr-cal .dnum{ font-size:10.5px; color:var(--ink-3); margin-bottom:4px; }
  .hr-cal .dnum.today{ color:#60a5fa; font-weight:800; }
  .leave-bar{ background:rgba(96,165,250,0.16); color:#60a5fa; border-radius:4px; padding:2px 5px; font-size:9.5px; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .leave-bar.bday{ background:rgba(244,114,182,0.16); color:#f472b6; }

  .inv-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow:var(--shadow); margin-bottom:12px; }
  .inv-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
  .inv-top .amt{ font-size:20px; font-weight:800; }
  .inv-top .nm{ text-align:end; }
  .inv-top .nm b{ font-size:13px; display:block; }
  .inv-top .nm span{ font-size:10.5px; color:var(--ink-3); }
  .inv-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; flex-wrap:wrap; gap:8px; }
  .inv-stats{ display:flex; gap:14px; font-size:11px; color:var(--ink-2); }

  .veh-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:12px; }
  .veh-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; box-shadow:var(--shadow); }
  .veh-card .plate{ font-size:15px; font-weight:800; margin-bottom:2px; }
  .veh-card .model{ font-size:11.5px; color:var(--ink-2); margin-bottom:2px; }
  .veh-card .driver{ font-size:10.5px; color:var(--ink-3); margin-bottom:8px; }
  .veh-card .pills{ display:flex; gap:6px; flex-wrap:wrap; }

  .kanban{ display:grid; grid-auto-flow:column; grid-auto-columns:minmax(220px,1fr); gap:12px; overflow-x:auto; padding-bottom:10px; }
  .kb-col{ background:var(--surface-2); border:1px solid var(--border); border-radius:12px; display:flex; flex-direction:column; min-height:110px; }
  .kb-col-head{ padding:10px 12px 8px; border-bottom:1px dashed var(--border); display:flex; align-items:center; gap:7px; }
  .kb-col-head .dot{ width:8px; height:8px; border-radius:50%; }
  .kb-col-head b{ font-size:11.5px; }
  .kb-col-head .count{ font-size:11px; color:var(--ink-3); margin-inline-start:auto; }

  function renderNav(){
    var nav = document.getElementById("nav");

    if(current.module === "production"){
      var lbl = document.createElement("div");

      nav.appendChild(back); nav.appendChild(lbl);
      PRODUCTION_TABS.forEach(function(tab){
        var active = current.tab===tab.id;
        var color = MOD_COLOR.production;
        var b = document.createElement("button");
        b.className = "sh-item"+(active?" is-on":"");
        b.style.cssText = '--nav-c:'+color+'; --nav-soft:'+rgba(color,0.17)+'; --nav-glow:'+rgba(color,0.75)+';';

    var stock = [["WP-2400","Wall Panel — 240cm","פרופילים חיצוניים",34,20],["RP-1800","Roof Panel — 180cm","פרופילים חיצוניים",12,15],["CP-STD","Corner Post — Standard","פינות ומחברים",8,10],["HD-STD","Hinged Door Assembly","דלתות ומשקופים",3,4],["INS-50","Insulation Sheet — 50mm","בידוד",61,40]];
    var low = stock.filter(function(s){ return s[3] < s[4]; }).length;
    var html = '<div class="banner">⚠ '+low+' '+t("wh.lowstock")+'</div>' +
      '<div class="toolbar"><button class="btn good">+ '+t("wh.new")+'</button><select class="select-box"><option>'+t("wh.allcats")+'</option></select><input class="search-box" placeholder="'+t("wh.search")+'"></div>' +
      '<div class="h-card"><div class="table-wrap"><table class="dt"><thead><tr><th>'+t("wh.col.item")+'</th><th>'+t("wh.col.cat")+'</th><th class="num">'+t("wh.col.stock")+'</th><th class="num">'+t("wh.col.min")+'</th><th>'+t("wh.col.status")+'</th></tr></thead><tbody>';
    stock.forEach(function(s){
      var low2 = s[3] < s[4];
      html += '<tr><td><b>'+s[1]+'</b><br><span style="color:var(--ink-3); font-size:10.5px;">'+s[0]+'</span></td><td>'+s[2]+'</td><td class="num">'+s[3]+'</td><td class="num">'+s[4]+'</td><td>'+(low2?'<span class="pill crit">'+t("wh.low")+'</span>':'<span class="pill good">'+t("wh.ok")+'</span>')+'</td></tr>';
    });
    html += '</tbody></table></div></div>';
    host.innerHTML = html;
  }

  function renderHR(){
    var html = '<div class="stat-tiles" style="grid-template-columns:repeat(3,1fr);">' +
      statTile("t-info",t("hr.next7"),"3") + statTile("t-warn",t("hr.absenttoday"),"0") + statTile("t-good",t("hr.activestaff"),"51") +
      '</div>' +
      '<div class="toolbar"><button class="btn primary">+ '+t("hr.addabsence")+'</button><button class="btn ghost">'+t("hr.print")+'</button><button class="btn good">'+t("hr.export")+'</button><span style="margin-inline-start:auto; font-weight:700;">'+(lang==="he"?"אוגוסט 2026":"August 2026")+'</span></div>' +
      '<div class="hr-cal" id="hrCal"></div>';
    host.innerHTML = html;
    var people = lang==="he" ?
      ["דנה כהן","יוסי לוי","מיכל אברהם","אבי פרץ","נועה שני","אלון רז"] :
      ["Dana Cohen","Yossi Levy","Michal Avraham","Avi Peretz","Noa Shani","Alon Raz"];
    var leaveDays = {3:[4],9:[0],11:[1],12:[1,4],13:[0],16:[3],20:[2],23:[5,"bday"],24:[],26:[2,"bday"],27:[0,1],28:[0]};
    var cal = document.getElementById("hrCal");
    var h = "";
    for(var i=1;i<=31;i++){
      var evts = leaveDays[i];
      var inner = '<div class="dnum'+(i===24?" today":"")+'">'+i+'</div>';
      if(evts && evts.length){
        var isBday = evts[evts.length-1]==="bday";
        var idxs = isBday ? evts.slice(0,-1) : evts;
        idxs.forEach(function(pi){ inner += '<div class="leave-bar'+(isBday?" bday":"")+'">'+people[pi]+'</div>'; });
      }
      h += '<div class="day-cell">'+inner+'</div>';
    }
    cal.innerHTML = h;
  }
  function statTile(cls,label,value){
    return '<div class="stat-tile '+cls+'"><div class="v num">'+value+'</div><div class="l">'+label+'</div></div>';
  }

  function renderInvoices(){
    var rows = [
      {code:"PRJ-2401", name:"North Site", total:63400, remaining:63400, paid:0, billed:0, note:true},
      {code:"PRJ-2402", name:"East Warehouse Unit", total:38200, remaining:38200, paid:0, billed:0, note:true},
      {code:"PRJ-2403", name:"Central Hall", total:81500, remaining:0, paid:81500, billed:0, note:false},
      {code:"PRJ-2405", name:"Hilltop Complex", total:52950, remaining:52950, paid:0, billed:0, note:true}
    ];
    var total = rows.reduce(function(s,r){return s+r.total;},0);
    var html = '<div class="stat-tiles">' +
      statTile("t-warn",t("inv.overdue"),"0") + statTile("t-warn",t("inv.matured"),"1") + statTile("t-info",t("inv.pending"),"₪0") + statTile("t-good",t("inv.paid"),"₪81,500") +
      '</div>' +
      '<input class="search-box" style="width:100%; margin-bottom:14px;" placeholder="'+t("inv.search")+'">';
    rows.forEach(function(r){
      html += '<div class="inv-card"><div class="inv-top"><span class="amt num">₪'+r.total.toLocaleString()+'</span><div class="nm"><b>'+r.name+'</b><span>'+r.code+'</span></div></div>' +
        '<div class="progress" style="margin-bottom:8px;"><span style="width:'+Math.round(r.paid/r.total*100)+'%"></span></div>' +
        '<div class="inv-stats"><span>'+t("inv.remaining")+': ₪'+r.remaining.toLocaleString()+'</span><span style="color:var(--ok)">'+t("inv.paid")+': ₪'+r.paid.toLocaleString()+'</span><span style="color:#60a5fa">'+t("inv.billed")+': ₪'+r.billed.toLocaleString()+'</span></div>' +
        (r.note?'<div style="font-size:10.5px; color:var(--ink-3); font-style:italic; margin-top:6px;">'+t("inv.noplan")+'</div>':'') +
        '<div class="inv-foot"><span style="font-size:11px; color:var(--ink-3);">0 '+t("inv.milestones")+'</span><span><button class="btn purple" style="margin-inline-end:6px;">+ '+t("inv.newmilestone")+'</button><button class="btn ghost">'+t("inv.plan")+'</button></span></div>' +
      '</div>';
    });
    host.innerHTML = html;
  }

  function renderLogistics(){
    var vehicles = [
      {plate:"42-771-90", model: lang==="he"?"מסחרי · 2022":"Van · 2022", driver:"רונית שדה", ins:151, test:160},
      {plate:"18-330-24", model: lang==="he"?"משאית · 2020":"Truck · 2020", driver:"עומר בכר", ins:37, test:78},
      {plate:"77-905-13", model: lang==="he"?"מסחרי · 2023":"Van · 2023", driver:"טל אריאלי", ins:229, test:341},
      {plate:"63-410-88", model: lang==="he"?"נגרר · 2021":"Trailer · 2021", driver:"נועה גל", ins:188, test:257}
    ];
    var expiring = vehicles.filter(function(v){ return v.ins<60 || v.test<60; }).length;
    var html = '<div class="banner">⚠ '+expiring+' '+t("lg.expiring")+'</div>' +
      '<div class="toolbar"><button class="btn purple">+ '+t("lg.newvehicle")+'</button><input class="search-box" placeholder="'+t("lg.search")+'"></div>' +
      '<div class="veh-grid">';
    vehicles.forEach(function(v){
      var insCls = v.ins<60?"crit":"good", testCls = v.test<60?"crit":"good";
      html += '<div class="veh-card"><div class="plate">'+v.plate+'</div><div class="model">'+v.model+'</div><div class="driver">👤 '+v.driver+'</div>' +
        '<div class="pills"><span class="pill '+insCls+'">'+t("lg.insurance")+': '+v.ins+' '+t("lg.days")+'</span><span class="pill '+testCls+'">'+t("lg.test")+': '+v.test+' '+t("lg.days")+'</span></div></div>';
    });
    html += '</div>';
    host.innerHTML = html;
  }

  function renderTasks(){
    var cols = [
      {key:"col.done", color:"var(--stage-ready)", items:[
        ["Weekly safety walk-through","אבי פרץ",true],["Restock corner post bin","דנה כהן",true],["Replace cutting blade — Station 2","יוסי לוי",true],["Confirm delivery window — PRJ-2403","מיכל אברהם",true],["Order insulation stock","אלון רז",true]
      ]},
      {key:"col.progress", color:"#fcd34d", items:[
        ["Calibrate bending press","נועה שני",false]
      ]},
      {key:"col.opened", color:"var(--stage-idle)", items:[]}
    ];
    var html = '<div class="stat-tiles">' +
      statTile("t-info",t("tasks.today"),"3") + statTile("t-warn",t("tasks.remindtoday"),"0") + statTile("t-good",t("tasks.donemonth"),"5") + statTile("t-purple",t("tasks.open"),"1") +
      '</div>' +
      '<div class="toolbar"><button class="btn primary">+ '+t("tasks.new")+'</button><select class="select-box">'+t("tasks.allpriority")+'</select><select class="select-box">'+t("tasks.allemployees")+'</select></div>' +
      '<div class="kanban">';
    cols.forEach(function(c){
      html += '<div class="kb-col"><div class="kb-col-head"><span class="dot" style="background:'+c.color+'"></span><b>'+t(c.key)+'</b><span class="count num">'+c.items.length+'</span></div><div class="kb-col-body">';
      c.items.forEach(function(item){
        html += '<div class="kb-card'+(item[2]?" done":"")+'"><b>'+item[0]+'</b><span class="meta">'+item[1]+'</span></div>';
      });
      html += '</div></div>';
    });
    html += '</div>';
    host.innerHTML = html;
  }

  function renderView(){
    if(current.module==="home") return renderHome();
    if(current.module==="production"){
      if(current.tab==="dashboard") return renderDashboard();
      if(current.tab==="project") return renderProject();
      if(current.tab==="drafting") return renderDrafting();
      if(current.tab==="floor") return renderFloor();
      if(current.tab==="doors") return renderDoors();
      if(current.tab==="schedule") return renderSchedule();
    }
    if(current.module==="warehouse") return renderWarehouse();
    if(current.module==="hr") return renderHR();
    if(current.module==="invoices") return renderInvoices();
    if(current.module==="logistics") return renderLogistics();
    if(current.module==="tasks") return renderTasks();
  }

  function renderAll(){
    applyI18n();
    renderNav();
    renderTopbar();
    renderView();
  }

  setLang("he");
})();
</script>
</body>
